<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASCEND — Dev Personnel RPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d0d14;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:5rem}
.screen{display:none}.screen.active{display:block}
.wrap{max-width:480px;margin:0 auto;padding:0 1rem}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:#111120;border-top:1px solid #2a2a3e;display:flex;z-index:100}
.nav button{flex:1;background:none;border:none;color:#666;padding:.7rem .3rem .5rem;font-size:.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.nav button.active{color:#f1c40f}
.nav button span.ico{font-size:1.2rem}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:1rem 1rem .8rem;border-bottom:2px solid #f1c40f22;margin-bottom:.5rem}
.hdr-name{font-size:1.25rem;font-weight:800;color:#f1c40f}
.hdr-sub{font-size:.78rem;color:#888;margin-top:.15rem}
.xp-wrap{margin-top:.5rem}
.xp-label{font-size:.72rem;color:#aaa;margin-bottom:.25rem}
.bar-outer{background:#1e1e2e;border-radius:99px;height:9px;overflow:hidden}
.bar-inner{height:100%;border-radius:99px;transition:width .5s ease}
.streak-line{font-size:.75rem;color:#e74c3c;margin-top:.35rem}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:.6rem 0}
.stat-card{background:#1a1a2e;border-radius:10px;padding:.55rem .75rem}
.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
.stat-name{font-size:.72rem;font-weight:600}
.stat-val{font-size:.72rem;color:#666}
.stat-bar{height:5px;border-radius:99px;background:#0a0a14;overflow:hidden}
.stat-fill{height:100%;border-radius:99px;transition:width .4s}

/* SECTION */
.sec-title{font-size:.72rem;font-weight:700;color:#555;letter-spacing:.1em;text-transform:uppercase;margin:.9rem 0 .45rem}

/* ACTION BUTTONS */
.act-btn{display:flex;align-items:center;gap:.75rem;background:#1a1a2e;border:1px solid #242438;border-radius:12px;padding:.75rem .9rem;margin-bottom:.45rem;width:100%;cursor:pointer;text-align:left;color:#e8e8f0;transition:background .12s,transform .1s}
.act-btn:active{background:#22223a;transform:scale(.98)}
.act-btn.boss-btn{border-color:#e74c3c33;background:#180e0e}
.act-btn.disabled{opacity:.35;cursor:not-allowed}
.act-ico{font-size:1.35rem;width:2rem;text-align:center}
.act-info{flex:1;min-width:0}
.act-name{font-size:.9rem;font-weight:600}
.act-desc{font-size:.68rem;color:#777;margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-cost{font-size:.72rem;color:#f1c40f;white-space:nowrap;margin-left:.3rem}

/* RESULT / CARD */
.card{background:#1a1a2e;border-radius:14px;padding:1.1rem 1.2rem;margin:.6rem 0}
.card-title{font-size:1rem;font-weight:700;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.res-item{display:flex;justify-content:space-between;align-items:center;padding:.28rem 0;font-size:.85rem;border-bottom:1px solid #1e1e2e}
.res-item:last-child{border:none}
.up{color:#2ecc71}.dn{color:#e74c3c}.gold{color:#f1c40f;font-weight:700}
.msg-txt{color:#aaa;font-style:italic;line-height:1.55;margin-bottom:.8rem;font-size:.85rem}
.levelup-banner{background:linear-gradient(135deg,#f39c12,#e74c3c);color:#fff;border-radius:10px;padding:.8rem;text-align:center;font-weight:800;font-size:.95rem;margin:.6rem 0;animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(.95)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.quest-reward{background:#152015;border:1px solid #2ecc7133;border-radius:10px;padding:.65rem .9rem;margin:.4rem 0}
.quest-r-name{color:#2ecc71;font-weight:700;font-size:.82rem}
.quest-r-sub{color:#aaa;font-size:.72rem;margin-top:.15rem}

/* EVENTS */
.ev-card{border-radius:14px;padding:1.1rem 1.2rem;margin:.6rem 0}
.ev-title{font-size:1rem;font-weight:800;margin-bottom:.5rem}
.ev-desc{color:#ccc;line-height:1.55;margin-bottom:1rem;font-size:.85rem}
.choice-btn{display:block;width:100%;background:#141424;border:1px solid #2a2a3e;border-radius:11px;padding:.8rem 1rem;margin-bottom:.45rem;cursor:pointer;text-align:left;font-size:.85rem;color:#e8e8f0;transition:background .12s,transform .1s}
.choice-btn:active{background:#1e1e3e;transform:scale(.98)}

/* BOSS */
.boss-card{background:linear-gradient(135deg,#1e0808,#120505);border:1px solid #e74c3c22;border-radius:14px;padding:1.2rem;text-align:center;margin:.6rem 0}
.boss-emoji{font-size:2.8rem;margin-bottom:.4rem}
.boss-name{font-size:1.1rem;font-weight:800;color:#e74c3c}
.boss-sub{color:#888;font-size:.8rem;margin-top:.3rem}
.hp-row{display:flex;align-items:center;gap:.7rem;margin:.5rem 0;font-size:.8rem}
.hp-lbl{width:3.5rem;color:#777;text-align:right}
.feedback-box{border-radius:10px;padding:.7rem .9rem;margin:.5rem 0;font-size:.85rem}
.feedback-ok{background:#102010;border:1px solid #2ecc7144;color:#2ecc71}
.feedback-no{background:#200e0e;border:1px solid #e74c3c44;color:#e74c3c}

/* QUESTS */
.quest-card{background:#1a1a2e;border-radius:11px;padding:.75rem 1rem;margin-bottom:.45rem;border-left:3px solid #333}
.quest-card.done{opacity:.5;border-left-color:#2ecc71}
.quest-card.open{border-left-color:#f39c12}
.q-name{font-weight:600;font-size:.88rem}
.q-desc{color:#777;font-size:.74rem;margin-top:.15rem}
.q-rew{color:#f39c12;font-size:.72rem;margin-top:.25rem}

/* CREATE */
.create-screen{padding:1.5rem 1rem 2rem}
.logo-block{text-align:center;padding:1.5rem 0 1.2rem}
.logo-title{font-size:2.2rem;font-weight:900;color:#f1c40f;letter-spacing:.04em}
.logo-sub{color:#777;margin-top:.3rem;font-size:.82rem}
label.field-lbl{display:block;font-size:.72rem;color:#777;margin-bottom:.35rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
input.txt-input{width:100%;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:10px;padding:.75rem 1rem;color:#e8e8f0;font-size:.95rem;outline:none;margin-bottom:1rem}
input.txt-input:focus{border-color:#f1c40f55}
.arch-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.35rem 0 1.2rem}
.arch-card{background:#1a1a2e;border:2px solid #242438;border-radius:12px;padding:.8rem .6rem;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.arch-card.sel{border-color:#f1c40f;background:#1c1c0d}
.arch-emo{font-size:1.7rem}
.arch-nm{font-size:.82rem;font-weight:700;margin:.25rem 0}
.arch-ds{font-size:.67rem;color:#777;line-height:1.3}
.btn-start{width:100%;background:linear-gradient(135deg,#f39c12,#e74c3c);color:#fff;border:none;border-radius:12px;padding:.95rem;font-size:.95rem;font-weight:800;cursor:pointer;letter-spacing:.02em}

/* BACK BTN */
.back-btn{display:block;text-align:center;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:11px;padding:.75rem;color:#aaa;font-size:.85rem;cursor:pointer;margin-top:.4rem;width:100%}
.back-btn:active{background:#222238}
</style>
</head>
<body>

<!-- ══ CREATE SCREEN ══ -->
<div id="s-create" class="screen active">
<div class="create-screen wrap">
  <div class="logo-block">
    <div class="logo-title">⚡ ASCEND</div>
    <div class="logo-sub">Le RPG du Développement Personnel</div>
  </div>
  <label class="field-lbl">Ton nom</label>
  <input id="inp-name" class="txt-input" type="text" placeholder="Ton prénom ou pseudo" maxlength="28">
  <label class="field-lbl">Archetype</label>
  <div class="arch-grid">
    <div class="arch-card sel" id="arch-Guerrier" onclick="selectArch('Guerrier')">
      <div class="arch-emo">&#9876;&#65039;</div>
      <div class="arch-nm" style="color:#e74c3c">Guerrier</div>
      <div class="arch-ds">Force et discipline. Tu avances quoi qu'il arrive.</div>
    </div>
    <div class="arch-card" id="arch-Erudit" onclick="selectArch('Erudit')">
      <div class="arch-emo">&#128218;</div>
      <div class="arch-nm" style="color:#3498db">Erudit</div>
      <div class="arch-ds">La connaissance est ton arme.</div>
    </div>
    <div class="arch-card" id="arch-Athlete" onclick="selectArch('Athlete')">
      <div class="arch-emo">&#127942;</div>
      <div class="arch-nm" style="color:#2ecc71">Athlete</div>
      <div class="arch-ds">Le corps est ton temple. L'effort te definit.</div>
    </div>
    <div class="arch-card" id="arch-Moine" onclick="selectArch('Moine')">
      <div class="arch-emo">&#129340;</div>
      <div class="arch-nm" style="color:#9b59b6">Moine</div>
      <div class="arch-ds">La paix interieure est ta force.</div>
    </div>
    <div class="arch-card" id="arch-Leader" onclick="selectArch('Leader')">
      <div class="arch-emo">&#128081;</div>
      <div class="arch-nm" style="color:#f39c12">Leader</div>
      <div class="arch-ds">Tu inspires les autres.</div>
    </div>
  </div>
  <button type="button" class="btn-start" onclick="startGame()">Commencer ma quete &#8594;</button>
</div>
</div>

<!-- ══ MAIN SCREEN ══ -->
<div id="s-main" class="screen">
  <div id="hdr-main"></div>
  <div class="wrap">
    <div id="stats-panel"></div>
    <div class="sec-title">Actions</div>
    <div id="actions-panel"></div>
  </div>
</div>

<!-- ══ RESULT SCREEN ══ -->
<div id="s-result" class="screen">
  <div id="hdr-result"></div>
  <div class="wrap" id="result-content"></div>
</div>

<!-- ══ EVENT SCREEN ══ -->
<div id="s-event" class="screen">
  <div id="hdr-event"></div>
  <div class="wrap" id="event-content"></div>
</div>

<!-- ══ BOSS SCREEN ══ -->
<div id="s-boss" class="screen">
  <div id="hdr-boss"></div>
  <div class="wrap" id="boss-content"></div>
</div>

<!-- ══ QUESTS SCREEN ══ -->
<div id="s-quests" class="screen">
  <div id="hdr-quests"></div>
  <div class="wrap" id="quests-content"></div>
</div>

<!-- ══ NAV ══ -->
<nav class="nav" id="bottom-nav" style="display:none">
  <button onclick="showMain()" id="nav-play"><span class="ico">⚡</span>Jouer</button>
  <button onclick="showQuests()" id="nav-quests"><span class="ico">📜</span>Quêtes</button>
  <button onclick="confirmReset()" id="nav-reset"><span class="ico">🔄</span>Nouveau</button>
</nav>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════

const ARCHETYPES = {

   gains:{}, isBoss:true,

const EVENTS = [
  {title:"TENTATION DIGITALE", color:"#f39c12",
   desc:"Le scroll infini t'appelle. 30 min gaspillées... ou tu résistes ?",
   choices:[
     {label:"Poser le téléphone et résister",      fx:{discipline:2,focus:1},    xp:15, msg:"Victoire silencieuse. Ces moments comptent."},
     {label:"Céder — juste 5 min (c'est ce qu'on dit)", fx:{discipline:-1,energie:-1}, xp:-5, msg:"30 min deviennent 2h. Tu le savais."},
   ]},
  {title:"OPPORTUNITÉ RISQUÉE", color:"#2ecc71",
   desc:"Un projet excitant mais incertain se présente. Deadline courte.",
   choices:[
     {label:"Foncer — l'inconfort est le chemin", fx:{discipline:1,social:2,focus:1}, xp:25, msg:"Tu dis oui. L'aventure commence."},
     {label:"Refuser — pas le bon moment",        fx:{mental:1},                     xp:5,  msg:"Tu gardes le cap. Sage décision."},
   ]},
  {title:"CRITIQUE PUBLIQUE", color:"#e74c3c",
   desc:"Quelqu'un critique ton travail devant tout le monde.",
   choices:[
     {label:"Répondre avec calme et faits",   fx:{mental:2,social:1},  xp:20,  msg:"Tu réponds avec classe. Les gens remarquent."},
     {label:"Ignorer et continuer d'avancer", fx:{discipline:2},       xp:15,  msg:"Tu préserves ton énergie pour ce qui compte."},

  {title:"INSPIRATION À 3H", color:"#9b59b6",

const QUESTS = [
  {name:"Premier Pas",      desc:"Effectue ta première action",         check:p=>p.actions_done>=1,                              reward:{xp:50,discipline:2}},
  {name:"Bâtisseur",        desc:"Effectue 10 actions",                 check:p=>p.actions_done>=10,                             reward:{xp:100,focus:3}},
  {name:"Corps & Esprit",   desc:"Entraîne-toi ET médite le même jour", check:p=>p.train_today&&p.meditate_today,                reward:{xp:80,sante:3,mental:3}},

const XP_TABLE = [0,100,250,450,700,1000,1400,1900,2500,3200,4000];

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════

let G = {};

// Visible error reporting (no console on mobile)
window.onerror = function(msg, src, line) {
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#e74c3c;color:#fff;padding:1rem;font-size:.85rem;position:fixed;top:0;left:0;right:0;z-index:9999">'+
    '⚠️ Erreur JS : '+msg+' (ligne '+line+')</div>');
  return false;
};

// Safe storage wrapper — file:// on iOS blocks localStorage
const store = (function() {
  var mem = {};
  try {
    localStorage.setItem('_t','1');
    localStorage.removeItem('_t');
    return localStorage;
  } catch(e) {
    return {
      getItem: function(k){ return mem[k] !== undefined ? mem[k] : null; },
      setItem: function(k,v){ mem[k]=v; },
      removeItem: function(k){ delete mem[k]; }
    };
  }
}());

function save() {
  try { store.setItem('ascend_v1', JSON.stringify(G)); } catch(e) {}
}
function load() {
  try {
    var raw = store.getItem('ascend_v1');
    if (raw) { G = JSON.parse(raw); return true; }
  } catch(e) {}
  return false;
}

function getLevel(xp) {
  for (let i=0;i<XP_TABLE.length;i++) if (xp < XP_TABLE[i]) return Math.max(1,i-1);
  return XP_TABLE.length-1;
}
function xpProgress(xp) {
  const lv = getLevel(xp);
  if (lv >= XP_TABLE.length-1) return {cur:XP_TABLE[lv-1],max:XP_TABLE[lv-1]};
  return {cur:xp-XP_TABLE[lv], max:XP_TABLE[lv+1]-XP_TABLE[lv]};
}
function addXP(amount) {
  const old = getLevel(G.p.xp);
  G.p.xp += amount;
  const nw = getLevel(G.p.xp);
  G.p.level = nw;
  return nw > old ? nw : null;
}
function clampStat(v) { return Math.min(20, Math.max(0, v)); }
function applyStat(stat, delta) {
  if (G.p.stats[stat] !== undefined) G.p.stats[stat] = clampStat(G.p.stats[stat]+delta);
}

function checkQuests() {
  const done = [];
  QUESTS.forEach((q,i) => {
    if (!G.questDone[i] && q.check(G.p)) {
      G.questDone[i] = true;
      done.push(q);
      Object.entries(q.reward).forEach(([k,v]) => {
        if (k==='xp') addXP(v);
        else if (G.p.stats[k]!==undefined) G.p.stats[k] = clampStat(G.p.stats[k]+v);
      });
    }
  });
  return done;
}

function updateStreak() {
  const today = new Date().toISOString().slice(0,10);
  const last = G.p.last_played;
  if (last === today) return;
  if (last) {
    const diff = (new Date(today)-new Date(last))/(1000*86400);
    G.p.streak = diff===1 ? (G.p.streak||1)+1 : 1;
  } else { G.p.streak = 1; }
  G.p.last_played = today;
  G.p.train_today = false;
  G.p.meditate_today = false;
}

// ═══════════════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════════════

function hdrHTML() {
  const arch = ARCHETYPES[G.p.archetype];
  const lv = getLevel(G.p.xp);
  const {cur,max} = xpProgress(G.p.xp);
  const pct = max ? Math.round(cur/max*100) : 100;
  const streak = G.p.streak||1;
  return `<div class="hdr"><div class="wrap">
    <div class="hdr-name">${G.p.name}</div>
    <div class="hdr-sub" style="color:${arch.color}">${G.p.archetype}</div> <div style="display:flex;align-items:center;gap:.5rem;margin-top:.1rem"><span style="font-size:.72rem;color:#888">Niveau</span><span style="font-size:.85rem;font-weight:800;color:#f1c40f">${lv}</span></div>
    <div class="xp-wrap">
      <div class="xp-label">XP ${cur}/${max}</div>
      <div class="bar-outer"><div class="bar-inner" style="width:${pct}%;background:linear-gradient(90deg,#f39c12,#e74c3c)"></div></div>
    </div>
    <div class="streak-line">🔥 Streak ${streak} jour${streak>1?'s':''} · ${new Date().toLocaleDateString('fr-FR')}</div>
  </div></div>`;
}

function statsHTML() {
  let h = '<div class="stats-grid">';
  Object.entries(STAT_META).forEach(([k,m]) => {
    const v = G.p.stats[k];
    const pct = (v/20)*100;
    h += `<div class="stat-card">
      <div class="stat-row"><span class="stat-name">${m.emoji} ${m.name}</span><span class="stat-val">${v}/20</span></div>
      <div class="stat-bar"><div class="stat-fill" style="width:${pct}%;background:${m.color}"></div></div>
    </div>`;
  });
  return h + '</div>';
}

function actionsHTML() {
  let h = '';
  ACTIONS.forEach(a => {
    const en = G.p.stats.energie;
    const disabled = a.cost > en;
    const costStr = a.cost > 0 ? `-${a.cost}⚡` : 'gratuit';
    const gainsStr = Object.entries(a.gains).filter(([,v])=>v>0).map(([s,v])=>`+${v} ${STAT_META[s].name}`).join(' · ');
    const desc = a.desc + (gainsStr ? ' · ' + gainsStr : '');
    const cls = `act-btn${a.isBoss?' boss-btn':''}${disabled?' disabled':''}`;
    const click = disabled ? '' : `onclick="doAction(${a.id})"`;
    h += `<button class="${cls}" ${click}>
      <span class="act-ico">${a.emoji}</span>
      <span class="act-info"><span class="act-name">${a.name}</span><span class="act-desc">${desc}</span></span>
      <span class="act-cost">${costStr}</span>
    </button>`;
  });
  return h;
}

function questsHTML() {
  let open='', done='';
  QUESTS.forEach((q,i) => {
    const rew = Object.entries(q.reward).map(([k,v])=>`+${v} ${k}`).join(' · ');
    if (G.questDone[i]) {
      done += `<div class="quest-card done"><div class="q-name">✅ ${q.name}</div><div class="q-desc">${q.desc}</div></div>`;
    } else {
      open += `<div class="quest-card open"><div class="q-name">⬜ ${q.name}</div><div class="q-desc">${q.desc}</div><div class="q-rew">🎁 ${rew}</div></div>`;
    }
  });
  return (open||'<p style="color:#555;font-size:.85rem">Toutes les quêtes sont accomplies !</p>') + (done ? `<div class="sec-title" style="margin-top:.8rem">Complètes</div>${done}` : '');
}

function resultExtras(levelUp, quests) {
  let h = '';
  if (levelUp) h += `<div class="levelup-banner">🎉 LEVEL UP → Niveau ${levelUp} !</div>`;
  quests.forEach(q => {
    const rew = Object.entries(q.reward).map(([k,v])=>`+${v} ${k}`).join(' · ');
    h += `<div class="quest-reward"><div class="quest-r-name">🏆 ${q.name}</div><div class="quest-r-sub">${q.desc} · ${rew}</div></div>`;
  });
  return h;
}

// ═══════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function setNavActive(id) {
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('nav-'+id);
  if (el) el.classList.add('active');
}

function showMain() {
  document.getElementById('hdr-main').innerHTML = hdrHTML();
  document.getElementById('stats-panel').innerHTML = statsHTML();
  document.getElementById('actions-panel').innerHTML = actionsHTML();
  showScreen('main');
  setNavActive('play');
}

function showQuests() {
  document.getElementById('hdr-quests').innerHTML = hdrHTML();
  document.getElementById('quests-content').innerHTML = questsHTML();
  showScreen('quests');
  setNavActive('quests');
}

// ═══════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════

function doAction(id) {
  const a = ACTIONS[id];
  if (a.isBoss) { startBoss(); return; }
  if (G.p.stats.energie < a.cost) return;

  G.p.stats.energie = clampStat(G.p.stats.energie - a.cost);
  const changes = [];
  Object.entries(a.gains).forEach(([s,d]) => {
    if (G.p.stats[s]!==undefined) {
      const before = G.p.stats[s];
      applyStat(s,d);
      const diff = G.p.stats[s]-before;
      if (diff) changes.push({s,diff});
    }
  });

  G.p.actions_done = (G.p.actions_done||0)+1;
  if (a.track==='train_today')    G.p.train_today=true;
  if (a.track==='meditate_today') G.p.meditate_today=true;
  if (a.track==='learn_count')    G.p.learn_count=(G.p.learn_count||0)+1;
  if (a.track==='connect_count')  G.p.connect_count=(G.p.connect_count||0)+1;

  const levelUp = addXP(a.xp);
  const quests = checkQuests();

  // Decide event once, keep in sync with button
  const triggerEvent = (id !== 6 && Math.random() < 0.35);
  if (triggerEvent) G._pendingEvent = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  save();

  let changesH = '';
  changes.forEach(({s,diff}) => {
    const m=STAT_META[s], cls=diff>0?'up':'dn', arr=diff>0?'↑':'↓';
    changesH += `<div class="res-item"><span>${m.emoji} ${m.name}</span><span class="${cls}">${arr}${Math.abs(diff)} → ${G.p.stats[s]}/20</span></div>`;
  });
  if (a.xp) changesH += `<div class="res-item"><span>✨ XP</span><span class="gold">+${a.xp}</span></div>`;

  document.getElementById('hdr-result').innerHTML = hdrHTML();
  document.getElementById('result-content').innerHTML = `
    <div class="card">
      <div class="card-title">${a.emoji} ${a.name}</div>
      <p class="msg-txt">${a.msg}</p>
      ${changesH}
    </div>
    ${resultExtras(levelUp, quests)}
    ${triggerEvent
      ? `<button class="btn-start" style="margin-top:.5rem" onclick="showEvent()">⚡ Événement →</button>`
      : `<button class="back-btn" onclick="showMain()">← Retour au jeu</button>`}
  `;
  showScreen('result');
  setNavActive('play');
}

// ═══════════════════════════════════════════════
// EVENT
// ═══════════════════════════════════════════════

function showEvent() {
  if (!G._pendingEvent) { showMain(); return; }
  const ev = G._pendingEvent;
  let choicesH = ev.choices.map((c,i)=>`<button class="choice-btn" onclick="pickEvent(${i})">${c.label}</button>`).join('');
  document.getElementById('hdr-event').innerHTML = hdrHTML();
  document.getElementById('event-content').innerHTML = `
    <div class="ev-card" style="background:#13131f;border:1px solid ${ev.color}33;margin-top:.6rem">
      <div class="ev-title" style="color:${ev.color}">⚡ ${ev.title}</div>
      <div class="ev-desc">${ev.desc}</div>
      ${choicesH}
    </div>`;
  showScreen('event');
}

function pickEvent(i) {
  const ev = G._pendingEvent;
  if (!ev) { showMain(); return; }
  const c = ev.choices[i];
  Object.entries(c.fx).forEach(([s,d])=>applyStat(s,d));
  const levelUp = c.xp>0 ? addXP(c.xp) : null;
  const quests = checkQuests();
  G._pendingEvent = null;
  save();

  let changesH = '';
  Object.entries(c.fx).forEach(([s,d]) => {
    const m=STAT_META[s], cls=d>0?'up':'dn', arr=d>0?'↑':'↓';
    changesH += `<div class="res-item"><span>${m.emoji} ${m.name}</span><span class="${cls}">${arr}${Math.abs(d)} → ${G.p.stats[s]}/20</span></div>`;
  });
  if (c.xp) changesH += `<div class="res-item"><span>✨ XP</span><span class="${c.xp>0?'gold':'dn'}">${c.xp>0?'+':''}${c.xp}</span></div>`;

  document.getElementById('hdr-event').innerHTML = hdrHTML();
  document.getElementById('event-content').innerHTML = `
    <div class="ev-card" style="background:#13131f;border:1px solid ${ev.color}33;margin-top:.6rem">
      <div class="ev-title" style="color:${ev.color}">⚡ ${ev.title}</div>
      <p class="msg-txt">"${c.label}" — ${c.msg}</p>
      ${changesH}
    </div>
    ${resultExtras(levelUp, quests)}
    <button class="back-btn" onclick="showMain()">← Retour au jeu</button>`;
}

// ═══════════════════════════════════════════════
// BOSS
// ═══════════════════════════════════════════════

function startBoss() {
  if (G.p.stats.energie < 5) { alert("Il te faut 5⚡ pour affronter un boss !"); return; }
  const available = BOSSES.map((_,i)=>i).filter(i=>!G.killedBosses.includes(i));
  if (!available.length) {
    document.getElementById('hdr-boss').innerHTML = hdrHTML();
    document.getElementById('boss-content').innerHTML = `
      <div class="boss-card" style="text-align:center;padding:2rem">
        <div style="font-size:2.5rem">🏆</div>
        <div style="font-weight:800;color:#f1c40f;margin:.5rem 0">Tous les boss vaincus !</div>
        <div style="color:#888;font-size:.85rem">Tu as maîtrisé tes ennemis intérieurs.</div>
      </div>
      <button class="back-btn" onclick="showMain()">← Retour</button>`;
    showScreen('boss'); return;
  }
  const bIdx = available[Math.floor(Math.random()*available.length)];
  G._boss = {idx:bIdx, move:0, playerHp:20, bossHp:BOSSES[bIdx].hp, dmgDealt:0};
  save();
  renderBossMove();
}

function renderBossMove(feedback) {
  const bf = G._boss;
  const boss = BOSSES[bf.idx];
  const move = boss.moves[bf.move];
  const bPct = Math.round(bf.bossHp/boss.hp*100);
  const pPct = Math.round(bf.playerHp/20*100);
  const feedH = feedback ? `<div class="feedback-box ${feedback.ok?'feedback-ok':'feedback-no'}">${feedback.msg}</div>` : '';
  const optsH = move.opts.map((o,i)=>`<button class="choice-btn" onclick="bossPick(${i})">${o.t}</button>`).join('');

  document.getElementById('hdr-boss').innerHTML = hdrHTML();
  document.getElementById('boss-content').innerHTML = `
    <div class="boss-card">
      <div class="boss-emoji">${boss.emoji}</div>
      <div class="boss-name">${boss.name}</div>
      <div class="boss-sub">${boss.desc}</div>
      <div class="hp-row"><span class="hp-lbl">👹 Boss</span>
        <div style="flex:1"><div class="bar-outer"><div class="bar-inner" style="width:${bPct}%;background:#e74c3c"></div></div></div>
        <span style="font-size:.75rem;color:#e74c3c">${bf.bossHp}/${boss.hp}</span></div>
      <div class="hp-row"><span class="hp-lbl">💚 Toi</span>
        <div style="flex:1"><div class="bar-outer"><div class="bar-inner" style="width:${pPct}%;background:#2ecc71"></div></div></div>
        <span style="font-size:.75rem;color:#2ecc71">${bf.playerHp}/20</span></div>
    </div>
    ${feedH}
    <div class="card"><div style="font-size:.85rem;color:#f1c40f;font-weight:700;line-height:1.4">${move.q}</div></div>
    ${optsH}`;
  showScreen('boss');
}

function bossPick(i) {
  const bf = G._boss;
  const boss = BOSSES[bf.idx];
  const opt = boss.moves[bf.move].opts[i];
  let feedback;

  if (opt.ok) {
    bf.bossHp = Math.max(0, bf.bossHp-Math.abs(opt.dmg));
    bf.dmgDealt += Math.abs(opt.dmg);
    feedback = {ok:true, msg:`✅ Bonne réponse ! -${Math.abs(opt.dmg)} HP au boss`};
  } else {
    const atk = 3+Math.floor(Math.random()*6);
    bf.playerHp = Math.max(0, bf.playerHp-atk);
    feedback = {ok:false, msg:`❌ Le boss riposte ! -${atk} HP`};
  }

  bf.move++;
  save();

  if (bf.playerHp<=0 || bf.move>=boss.moves.length) {
    endBoss(feedback);
  } else {
    renderBossMove(feedback);
  }
}

function endBoss(lastFeedback) {
  const bf = G._boss;
  const boss = BOSSES[bf.idx];
  const win = bf.playerHp>0 && (bf.bossHp===0 || bf.dmgDealt>=Math.floor(boss.hp/2));

  G.p.stats.energie = clampStat(G.p.stats.energie-5);
  let rewH = '';
  if (win) {
    Object.entries(boss.reward).forEach(([k,v]) => {
      if (k==='xp') {
        const lv=addXP(v);
        rewH += `<div class="res-item"><span>✨ XP</span><span class="gold">+${v}</span></div>`;
        if (lv) rewH += `<div class="levelup-banner">🎉 LEVEL UP → Niveau ${lv} !</div>`;
      } else if (G.p.stats[k]!==undefined) {
        G.p.stats[k]=clampStat(G.p.stats[k]+v);
        const m=STAT_META[k];
        rewH += `<div class="res-item"><span>${m.emoji} ${m.name}</span><span class="up">+${v} → ${G.p.stats[k]}/20</span></div>`;
      }
    });
    G.p.bosses_killed=(G.p.bosses_killed||0)+1;
    if (!G.killedBosses.includes(bf.idx)) G.killedBosses.push(bf.idx);
  } else {
    G.p.stats.mental=clampStat(G.p.stats.mental-1);
  }

  const quests = checkQuests();
  delete G._boss;
  save();

  const feedH = lastFeedback ? `<div class="feedback-box ${lastFeedback.ok?'feedback-ok':'feedback-no'}">${lastFeedback.msg}</div>` : '';

  document.getElementById('hdr-boss').innerHTML = hdrHTML();
  document.getElementById('boss-content').innerHTML = `
    ${feedH}
    <div class="boss-card" style="text-align:center">
      <div style="font-size:2rem">${win?'🏆':'💀'}</div>
      <div style="font-weight:800;color:${win?'#f1c40f':'#e74c3c'};margin:.4rem 0">${win?'VICTOIRE !':'Défaite...'}</div>
      <div style="color:#888;font-size:.82rem">${win?`"${boss.name}" est vaincu.`:"L'échec est un professeur. Reviens plus fort."}</div>
    </div>
    ${rewH ? `<div class="card">${rewH}</div>` : ''}
    ${resultExtras(null, quests)}
    <button class="back-btn" onclick="showMain()">← Retour au jeu</button>`;
}

// ═══════════════════════════════════════════════
// CREATE CHARACTER
// ═══════════════════════════════════════════════

var selectedArch = 'Guerrier';

function selectArch(name) {
  selectedArch = name;
  var cards = document.querySelectorAll('.arch-card');
  for (var i = 0; i < cards.length; i++) cards[i].classList.remove('sel');
  var el = document.getElementById('arch-' + name);
  if (el) el.classList.add('sel');
}

function startGame() {
  try {
    var name = (document.getElementById('inp-name').value || '').trim() || 'Aventurier';
    var archName = selectedArch || 'Guerrier';
    var arch = ARCHETYPES[archName];
    if (!arch) { alert('Archétype manquant: ' + archName); return; }

    var stats = Object.assign({}, arch.stats);
    var questDone = [];
    for (var i = 0; i < QUESTS.length; i++) questDone.push(false);

    G = {
      p: {
        name: name, archetype: archName, xp: 0, level: 1,
        stats: stats,
        actions_done: 0, bosses_killed: 0, streak: 1,
        last_played: new Date().toISOString().slice(0,10),
        train_today: false, meditate_today: false,
        learn_count: 0, connect_count: 0,
      },
      questDone: questDone,
      killedBosses: [],
    };
    save();
    document.getElementById('bottom-nav').style.display = 'flex';
    showMain();
  } catch(e) {
    alert('Erreur startGame: ' + e.message);
  }
}

function confirmReset() {
  if (confirm('Créer un nouveau personnage ? Ta progression sera effacée.')) {
    store.removeItem('ascend_v1');
    location.reload();
  }
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════

if (load()) {
  updateStreak();
  save();
  document.getElementById('bottom-nav').style.display='flex';
  showMain();
}
</script>
